name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-lint-typecheck-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: risesolo
          POSTGRES_PASSWORD: risesolo
          POSTGRES_DB: risesolo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U risesolo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Koristi ista test baza koju apps/api/test/game-engine.e2e-spec.ts
      # ocekuje kao default kada DATABASE_URL nije vec postavljen lokalno.
      DATABASE_URL: postgresql://risesolo:risesolo@localhost:5432/risesolo_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Apply Prisma migrations (apps/api test database)
        run: pnpm --filter @risesolo/api exec prisma migrate deploy

      - name: Test
        run: pnpm test
