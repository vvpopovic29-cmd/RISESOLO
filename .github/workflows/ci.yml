name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-lint-typecheck-test:
    runs-on: ubuntu-latest
    # Bez ovoga podrazumevani GitHub Actions limit je 6h - ako se posao nekad
    # zaglavi (npr. nedostupan servis-kontejner), umesto sata cekanja na
    # jasnu grešku, prekida se brzo i vidljivo.
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: risesolo
          POSTGRES_PASSWORD: risesolo
          POSTGRES_DB: risesolo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U risesolo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # apps/api testovi (unit + e2e) zahtevaju validan environment (Zod sema
      # u apps/api/src/config/env.ts), pravu Postgres bazu (core-gameplay-loop
      # e2e test radi prave upite, ne mock) i pravi Redis (rate limit storage,
      # BullMQ push red, CacheService - vidi README "Rate Limiting & Monitoring").
      DATABASE_URL: postgresql://risesolo:risesolo@localhost:5432/risesolo
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-secret-do-not-use-in-production
      JWT_EXPIRES_IN: 7d
      NODE_ENV: test
      # Test-only shared secret za RevenueCat webhook e2e testove (vidi
      # apps/api/test/subscriptions.e2e-spec.ts) - NIJE stvaran RevenueCat
      # nalog, samo omogucava testiranje naseg webhook auth koda.
      REVENUECAT_WEBHOOK_AUTH_HEADER: ci-test-revenuecat-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Apply database migrations
        run: pnpm --filter @risesolo/api run prisma:deploy

      - name: Seed exercise library
        run: pnpm --filter @risesolo/api run prisma:seed

      - name: Test
        run: pnpm test
